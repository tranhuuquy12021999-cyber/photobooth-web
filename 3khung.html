<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chụp 3 Ảnh - HQ-Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css"> 
    
    <!-- THƯ VIỆN AI GOOGLE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #fdf2f8; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        #filterPanelContainer h3, #glassesContainer h3, #hatsContainer h3 { margin-top: 8px !important; margin-bottom: 4px !important; }
        #filterPanelContainer .pb-2, #glassesContainer .mb-4, #hatsContainer .pb-4 { padding-bottom: 4px !important; margin-bottom: 4px !important; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen font-sans flex flex-col pb-2 h-[100dvh]">

    <div class="flex justify-between items-center px-4 py-2 flex-shrink-0">
        <button onclick="goBack()" class="text-gray-500 hover:text-pink-500 font-bold text-sm bg-white px-3 py-1 rounded-full shadow-sm transition">← Quay lại</button>
        <div class="text-right"><h1 class="text-2xl text-pink-400 logo-font">HQ-Photo</h1></div>
    </div>

    <div id="previewModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <button onclick="closePreview()" class="absolute top-6 right-6 text-white bg-gray-800/60 rounded-full p-2 hover:bg-gray-700 active:scale-90 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
        <div class="text-pink-400 font-bold mb-4">Xem trước ảnh <span id="previewIndexLabel">1</span></div>
        <img id="previewImage" class="max-h-[65vh] max-w-full rounded-xl shadow-2xl border-2 border-pink-400 mb-8 object-contain">
        <button onclick="retakeCurrentPhoto()" class="w-full max-w-xs bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 rounded-full shadow-[0_8px_20px_rgba(236,72,153,0.4)] active:scale-95 transition flex justify-center items-center gap-2">Chụp lại ảnh này</button>
    </div>

    <!-- MÀN HÌNH 1: CAMERA VÀ LÀM ĐẸP -->
    <div id="mainCameraArea" class="flex flex-col items-center w-full flex-1 overflow-y-auto">
        <div class="px-4 flex justify-center w-full relative">
            <div class="camera-container relative bg-gray-200 shadow-md">
                <video id="camera" class="absolute inset-0 w-full h-full object-cover opacity-0" autoplay playsinline muted></video>
                <canvas id="arCanvas" class="absolute inset-0 w-full h-full object-cover transition-transform duration-300"></canvas>
                <button onclick="switchCamera()" class="absolute top-3 right-3 w-9 h-9 bg-white/80 rounded-full flex items-center justify-center text-pink-500 shadow-md active:scale-90 transition z-40"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg></button>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-pink-400 text-white text-xs px-4 py-1.5 rounded-full font-bold z-20 shadow border border-pink-300">Đã Chụp <span id="shootCount">0</span>/3</div>
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-[100px] text-white font-bold drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] hidden z-30"></div>
                <div id="aiLoader" class="absolute inset-0 flex items-center justify-center bg-white/80 z-40 flex-col transition-opacity duration-300"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mb-2"></div><span class="text-xs text-pink-500 font-bold mt-2">AI đang khởi động...</span></div>
            </div>
        </div>

        <div id="thumbnailsContainer" class="flex justify-center gap-3 mt-2 mb-1 w-full max-w-sm px-4"></div>

        <div id="captureControls" class="flex justify-center items-center gap-6 mt-1 w-full max-w-sm mx-auto">
            <button onclick="captureManual()" class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center text-pink-400 shadow-inner font-medium text-[10px] flex-col active:scale-95 transition">Tay</button>
            <button onclick="startAutoCapture()" class="w-20 h-20 bg-pink-400 rounded-full flex flex-col items-center justify-center text-white font-bold shadow-lg border-4 border-white active:scale-95 transition"><span class="text-[9px] tracking-wider">AUTO</span></button>
            <select id="countdownSelect" class="bg-white border border-pink-200 rounded px-2 py-1 outline-none text-gray-700 text-xs font-bold shadow-sm"><option value="3">3s</option><option value="5">5s</option></select>
        </div>

        <div id="proceedControls" class="hidden justify-center items-center mt-2 w-full max-w-sm mx-auto px-4">
            <button onclick="showWorkspace()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-pink-200 active:scale-95 transition flex justify-center items-center gap-2">Hoàn thành & Chọn khung</button>
        </div>

        <div id="filterPanelContainer" class="w-full max-w-sm mx-auto"></div> 
        <div id="glassesContainer" class="w-full max-w-sm mx-auto"></div> 
        <div id="hatsContainer" class="w-full max-w-sm mx-auto"></div> 
    </div>

    <!-- MÀN HÌNH 2: WORKSPACE CHỌN KHUNG GIAO DIỆN -->
    <div id="workspaceArea" class="hidden w-full flex-1 px-3 flex-row gap-3 overflow-hidden">
        
        <!-- CỘT TRÁI: PREVIEW THÀNH QUẢ -->
        <div class="w-[48%] flex flex-col items-center h-full">
            <div class="bg-green-500 text-white text-[10px] font-bold py-1 px-3 rounded-full mb-2 flex items-center gap-1 shadow-sm">Demo Khung</div>
            <div class="flex-1 w-full flex justify-center items-start overflow-hidden bg-white p-1 shadow-md border border-gray-200 rounded-md">
                <canvas id="resultCanvas" class="w-full h-auto object-contain"></canvas>
            </div>
            <button onclick="downloadImage()" class="mt-3 w-full py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md active:scale-95 transition text-sm flex justify-center items-center gap-2">Tải ảnh</button>
            <button onclick="goBack()" class="mt-2 w-full py-1.5 bg-gray-200 text-gray-700 rounded-lg font-bold active:scale-95 transition text-sm">Chụp lại</button>
        </div>

        <!-- CỘT PHẢI: LỌC & DANH SÁCH KHUNG -->
        <div class="w-[52%] flex flex-col h-full bg-white rounded-xl shadow-sm border border-pink-100 p-2 overflow-hidden">
            
            <div class="flex flex-col gap-2 mb-2 pb-2 border-b border-pink-50">
                
                <!-- HÀNG 1: Chọn Chủ Đề VÀ Chọn Tỉnh nằm ngang nhau -->
                <div class="flex gap-2 w-full">
                    <div class="flex-1 flex flex-col relative">
                        <span class="text-pink-500 font-bold text-[9px] mb-1">Chủ Đề Khung:</span>
                        <select id="categorySelect" onchange="onCategoryChange()" class="w-full text-[9px] bg-pink-50 border border-pink-200 text-pink-600 rounded p-1 outline-none font-bold appearance-none">
                            <option value="All">Tất cả</option>
                            <option value="Tên Đơn Vị">Tên Đơn Vị</option>
                            <option value="64 Tỉnh Thành">64 Tỉnh Thành</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <div class="pointer-events-none absolute bottom-1 right-0 flex items-center px-1 text-pink-500"><svg class="fill-current h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                    </div>

                    <!-- Ô Chọn Tỉnh (Chỉ hiện khi Chủ đề là 64 Tỉnh Thành) -->
                    <div id="provinceWrapper" class="flex-1 flex flex-col relative hidden">
                        <span class="text-pink-500 font-bold text-[9px] mb-1">Tỉnh Thành:</span>
                        <select id="provinceSelect" onchange="onProvinceChange()" class="w-full text-[9px] bg-white border border-gray-200 text-gray-700 rounded p-1 outline-none font-bold appearance-none">
                            <!-- JS điền danh sách tỉnh -->
                        </select>
                        <div class="pointer-events-none absolute bottom-1 right-0 flex items-center px-1 text-gray-500"><svg class="fill-current h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                    </div>
                </div>
                
                <!-- HÀNG 2: Tìm kiếm -->
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-1.5 pointer-events-none"><svg class="w-3 h-3 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></div>
                    <input type="text" id="searchInput" oninput="filterFrames()" placeholder="Tìm khung..." class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-[10px] rounded focus:ring-pink-300 focus:border-pink-300 block pl-5 py-1 outline-none placeholder-gray-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 overflow-y-auto custom-scrollbar h-full pb-10" id="availableFramesGrid">
                <!-- Javascript sẽ in khung vào đây -->
            </div>
        </div>
    </div>

    <!-- NHÚNG MODULES BỘ LỌC VÀ PHỤ KIỆN -->
    <script src="boloc/core_boloc.js"></script> 
    <script src="boloc/mac_dinh.js"></script> 
    <script src="boloc/trang_hong.js"></script> 
    <script src="Kinh/kinh.js"></script> 
    <script src="Mu/mu.js"></script> 
    
    <!-- KHAI BÁO BIẾN TỔNG -->
    <script>var ALL_FRAMES = [];</script>
    
    <!-- CÁP NHẬT LẠI ĐƯỜNG DẪN CÁC FILE JS SAU KHI CHUYỂN THƯ MỤC -->
    <script src="style3/khung_cucxanh.js"></script> 
    <script src="style3/khung_gty.js"></script>
    <script src="donvi/khung_kt_team.js"></script>
    <script src="donvi/khung_kn_team.js"></script>
    <script src="64tinh/tinh_thanh.js"></script>

    <!-- LOGIC ỨNG DỤNG CHÍNH -->
    <script>
        // INIT GIAO DIỆN TỈNH THÀNH
        const provSelect = document.getElementById('provinceSelect');
        if (typeof PROVINCES_DATA !== 'undefined') {
            PROVINCES_DATA.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id; opt.text = p.name;
                provSelect.appendChild(opt);
            });
        }

        // =====================================
        // LOGIC LÕI CỦA TRANG
        // =====================================
        let currentAccessoryType = 'none', currentAccessorySrc = null;
        const accessoryImgElement = new Image();
        function selectAccessory(type, src, btnElement) {
            currentAccessoryType = type;
            if (src) { currentAccessorySrc = src; accessoryImgElement.src = src; } 
            else { currentAccessorySrc = null; }
            document.querySelectorAll('.acc-btn').forEach(btn => { btn.classList.remove('border-pink-400'); btn.classList.add('border-transparent'); });
            btnElement.classList.remove('border-transparent'); btnElement.classList.add('border-pink-400');
        }

        renderFilterPanel('filterPanelContainer'); renderGlassesPanel('glassesContainer'); renderHatsPanel('hatsContainer');

        const video = document.getElementById('camera'); const arCanvas = document.getElementById('arCanvas'); const arCtx = arCanvas.getContext('2d');
        const canvas = document.getElementById('resultCanvas'); const ctx = canvas.getContext('2d'); const aiLoader = document.getElementById('aiLoader');
        const mainCameraArea = document.getElementById('mainCameraArea'); const workspaceArea = document.getElementById('workspaceArea');
        
        let rawImages = [], isProcessing = false; let useFrontCamera = true, aiCameraInstance = null; let viewingPhotoIndex = -1, retakingIndex = -1;
        let currentSelectedFrame = null;

        function onResultsFaceMesh(results) {
            if(aiLoader) { aiLoader.style.opacity = '0'; setTimeout(() => { if(aiLoader) aiLoader.style.display = 'none'; }, 300); }
            arCanvas.width = video.videoWidth; arCanvas.height = video.videoHeight;
            arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);
            arCtx.save(); arCtx.filter = currentActiveFilter ? currentActiveFilter.baseFilter : 'none';
            arCtx.drawImage(results.image, 0, 0, arCanvas.width, arCanvas.height); arCtx.restore();

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                if (currentActiveFilter && currentActiveFilter.faceFilter) {
                    if (!window.faceMaskCanvas) { window.faceMaskCanvas = document.createElement('canvas'); window.faceMaskCtx = window.faceMaskCanvas.getContext('2d'); }
                    const fmCanvas = window.faceMaskCanvas, fmCtx = window.faceMaskCtx;
                    fmCanvas.width = arCanvas.width; fmCanvas.height = arCanvas.height;
                    fmCtx.save(); fmCtx.filter = currentActiveFilter.faceFilter; fmCtx.drawImage(results.image, 0, 0, fmCanvas.width, fmCanvas.height); fmCtx.restore();
                    fmCtx.globalCompositeOperation = 'destination-in';
                    const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
                    fmCtx.beginPath(); FACE_OVAL.forEach((index, i) => { const pt = landmarks[index]; const x = pt.x * fmCanvas.width, y = pt.y * fmCanvas.height; if (i === 0) fmCtx.moveTo(x, y); else fmCtx.lineTo(x, y); });
                    fmCtx.closePath(); fmCtx.shadowColor = 'black'; fmCtx.shadowBlur = 20; fmCtx.fillStyle = 'black'; fmCtx.fill(); fmCtx.fill(); 
                    arCtx.drawImage(fmCanvas, 0, 0);
                }
                if (currentActiveFilter && currentActiveFilter.hasLipstick) {
                    arCtx.save(); const lipIndices = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
                    arCtx.beginPath(); lipIndices.forEach((index, i) => { const pt = landmarks[index]; if (i === 0) arCtx.moveTo(pt.x * arCanvas.width, pt.y * arCanvas.height); else arCtx.lineTo(pt.x * arCanvas.width, pt.y * arCanvas.height); });
                    arCtx.closePath(); arCtx.fillStyle = currentActiveFilter.lipstickColor; arCtx.globalCompositeOperation = 'multiply'; arCtx.fill(); arCtx.restore();
                }
                if (currentAccessoryType !== 'none' && currentAccessorySrc) {
                    const leftEye = landmarks[33], rightEye = landmarks[263];
                    const eyeDistance = Math.hypot(rightEye.x * arCanvas.width - leftEye.x * arCanvas.width, rightEye.y * arCanvas.height - leftEye.y * arCanvas.height);
                    const angle = Math.atan2(rightEye.y * arCanvas.height - leftEye.y * arCanvas.height, rightEye.x * arCanvas.width - leftEye.x * arCanvas.width);
                    arCtx.save();
                    if (currentAccessoryType === 'glass') {
                        const centerX = (leftEye.x * arCanvas.width + rightEye.x * arCanvas.width) / 2, centerY = (leftEye.y * arCanvas.height + rightEye.y * arCanvas.height) / 2;
                        const glassesW = eyeDistance * 2.3, glassesH = accessoryImgElement.height * (glassesW / accessoryImgElement.width);
                        arCtx.translate(centerX, centerY); arCtx.rotate(angle); arCtx.drawImage(accessoryImgElement, -glassesW / 2, -glassesH / 2, glassesW, glassesH);
                    } else if (currentAccessoryType === 'hat') {
                        const hX = landmarks[10].x * arCanvas.width, hY = landmarks[10].y * arCanvas.height;
                        const hatW = eyeDistance * 3.2, hatH = accessoryImgElement.height * (hatW / accessoryImgElement.width);
                        arCtx.translate(hX, hY); arCtx.rotate(angle); arCtx.drawImage(accessoryImgElement, -hatW / 2, -hatH * 0.7, hatW, hatH);
                    }
                    arCtx.restore();
                }
            }
        }
        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        faceMesh.onResults(onResultsFaceMesh);

        function startCamera() {
            if (aiCameraInstance) aiCameraInstance.stop();
            arCanvas.style.transform = useFrontCamera ? "scaleX(-1)" : "scaleX(1)";
            aiCameraInstance = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 480, height: 640, facingMode: useFrontCamera ? "user" : "environment" });
            aiCameraInstance.start();
        }
        function switchCamera() { useFrontCamera = !useFrontCamera; if(aiLoader) { aiLoader.style.display = 'flex'; aiLoader.style.opacity = '1'; } startCamera(); }
        startCamera();

        function updateThumbnails() {
            const container = document.getElementById('thumbnailsContainer'); container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < rawImages.length) {
                    const imgData = rawImages[i].toDataURL('image/jpeg', 0.8);
                    container.innerHTML += `<div onclick="openPreview(${i})" class="w-14 h-[75px] bg-white border-2 border-pink-400 rounded-md shadow-sm overflow-hidden cursor-pointer active:scale-90 transition"><img src="${imgData}" class="w-full h-full object-cover"></div>`;
                } else {
                    container.innerHTML += `<div class="w-14 h-[75px] bg-pink-50/50 border border-pink-200 rounded-md shadow-inner flex items-center justify-center text-pink-300 text-xs font-bold">${i + 1}</div>`;
                }
            }
        }
        updateThumbnails();

        function openPreview(index) {
            viewingPhotoIndex = index; const modal = document.getElementById('previewModal');
            document.getElementById('previewImage').src = rawImages[index].toDataURL('image/jpeg', 0.9);
            document.getElementById('previewIndexLabel').innerText = index + 1;
            modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }
        function closePreview() { const modal = document.getElementById('previewModal'); modal.classList.add('opacity-0'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300); }

        async function retakeCurrentPhoto() {
            retakingIndex = viewingPhotoIndex; closePreview();
            if(isProcessing) return; isProcessing = true;
            document.getElementById('proceedControls').classList.add('hidden'); document.getElementById('proceedControls').classList.remove('flex');
            await countdownTimer(3); takeSnapshot(); isProcessing = false; checkReadyToProceed();
        }

        function checkReadyToProceed() {
            if(rawImages.length >= 3 && retakingIndex === -1) {
                document.getElementById('captureControls').classList.add('hidden'); document.getElementById('captureControls').classList.remove('flex');
                document.getElementById('proceedControls').classList.remove('hidden'); document.getElementById('proceedControls').classList.add('flex');
            } else {
                document.getElementById('captureControls').classList.remove('hidden'); document.getElementById('captureControls').classList.add('flex');
                document.getElementById('proceedControls').classList.add('hidden'); document.getElementById('proceedControls').classList.remove('flex');
            }
        }

        function goBack() {
            if (!workspaceArea.classList.contains('hidden')) {
                workspaceArea.classList.add('hidden'); workspaceArea.classList.remove('flex');
                rawImages = []; retakingIndex = -1; document.getElementById('shootCount').innerText = '0';
                updateThumbnails(); checkReadyToProceed();
                mainCameraArea.classList.remove('hidden'); mainCameraArea.classList.add('flex');
                return;
            }
            window.location.href = 'index.html';
        }

        function takeSnapshot() {
            const tempCanvas = document.createElement('canvas'); tempCanvas.width = video.videoWidth; tempCanvas.height = video.videoHeight;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.save(); if (useFrontCamera) { tCtx.translate(tempCanvas.width, 0); tCtx.scale(-1, 1); }
            tCtx.drawImage(arCanvas, 0, 0, tempCanvas.width, tempCanvas.height); tCtx.restore();

            if (retakingIndex !== -1) { rawImages[retakingIndex] = tempCanvas; retakingIndex = -1; } else { rawImages.push(tempCanvas); }
            document.getElementById('shootCount').innerText = rawImages.length; updateThumbnails();
        }

        async function captureManual() { if(isProcessing || (rawImages.length >= 3 && retakingIndex === -1)) return; await countdownTimer(1); takeSnapshot(); checkReadyToProceed(); }
        async function startAutoCapture() {
            if(isProcessing) return; isProcessing = true; 
            const remaining = 3 - rawImages.length, val = parseInt(document.getElementById('countdownSelect').value);
            for(let i = 0; i < remaining; i++) { await countdownTimer(val); takeSnapshot(); }
            isProcessing = false; checkReadyToProceed();
        }

        function countdownTimer(sec) {
            return new Promise(res => {
                const el = document.getElementById('countdown'); el.classList.remove('hidden'); let count = sec; el.innerText = count;
                const intv = setInterval(() => { count--; if(count>0) el.innerText = count; else { clearInterval(intv); el.classList.add('hidden'); res(); } }, 1000);
            });
        }

        // =====================================
        // WORKSPACE CHỌN KHUNG TỐI ƯU HÓA
        // =====================================
        function showWorkspace() {
            mainCameraArea.classList.add('hidden'); mainCameraArea.classList.remove('flex');
            workspaceArea.classList.remove('hidden'); workspaceArea.classList.add('flex');
            
            ALL_FRAMES.forEach(f => {
                if(f.name.toLowerCase().includes('kỹ thuật') || f.name.toLowerCase().includes('kiểm nghiệm')) f.category = 'Tên Đơn Vị';
                else if (f.category !== '64 Tỉnh Thành') f.category = 'Khác';
            });
            
            filterFrames(); 
        }

        function onCategoryChange() {
            const cat = document.getElementById('categorySelect').value;
            const provWrapper = document.getElementById('provinceWrapper');
            if (cat === '64 Tỉnh Thành') provWrapper.classList.remove('hidden');
            else provWrapper.classList.add('hidden');
            filterFrames();
        }

        // Khi đổi Tỉnh -> Tự động ghép vào khung đang chọn
        function onProvinceChange() {
            if (currentSelectedFrame && currentSelectedFrame.category === '64 Tỉnh Thành') {
                applyFrameAndRender(currentSelectedFrame);
            }
        }

        function filterFrames() {
            const category = document.getElementById('categorySelect').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('availableFramesGrid'); 
            grid.innerHTML = '';
            
            let filteredFrames = ALL_FRAMES.filter(f => f.type === 3);
            if (category !== 'All') filteredFrames = filteredFrames.filter(f => f.category === category);
            if (searchQuery !== '') filteredFrames = filteredFrames.filter(f => f.name.toLowerCase().includes(searchQuery));

            filteredFrames.forEach((frame) => {
                const div = document.createElement('div');
                div.className = `frame-item flex flex-col items-center bg-gray-50 p-1 rounded-md border-2 border-transparent cursor-pointer transition`;
                div.id = `frame_btn_${frame.id}`;
                
                div.onclick = () => {
                    document.querySelectorAll('.frame-item').forEach(el => el.classList.remove('border-pink-500'));
                    div.classList.add('border-pink-500');
                    currentSelectedFrame = frame;
                    applyFrameAndRender(frame);
                };
                
                // DANH SÁCH CHỈ HIỆN KHUNG GỐC (KHÔNG HIỆN ẢNH TỈNH ĐỂ TRÁNH RỐI MẮT)
                div.innerHTML = `
                    <div class="relative w-full aspect-[1/3] mb-1">
                        <img src="${frame.src}" class="absolute inset-0 w-full h-full object-contain rounded drop-shadow-sm z-10">
                    </div>
                    <span class="text-[9px] font-bold text-gray-600 text-center w-full truncate leading-tight">${frame.name}</span>
                `;
                grid.appendChild(div);
            });

            if(filteredFrames.length > 0) document.getElementById(`frame_btn_${filteredFrames[0].id}`).click();
        }

        // HÀM TẠO FRAME ẢO VÀ VẼ
        function applyFrameAndRender(frame) {
            let frameConfig = { ...frame }; // Tạo bản sao để không làm hỏng dữ liệu gốc
            
            // NẾU LÀ KHUNG 64 TỈNH -> TỰ ĐỘNG LẤY ẢNH TỈNH ĐANG CHỌN ĐỂ DÁN VÀO
            if (frameConfig.category === '64 Tỉnh Thành' && typeof PROVINCES_DATA !== 'undefined') {
                const selectedProvId = document.getElementById('provinceSelect').value;
                const provData = PROVINCES_DATA.find(p => p.id === selectedProvId);
                if (provData) {
                    frameConfig.overlaySrc = provData.overlaySrc;
                    frameConfig.overlayPos = { x: 88, y: 2773, w: 1027, h: 741 };
                }
            }
            processFinalImage(frameConfig);
        }

        async function processFinalImage(frameConfig) {
            const layout = frameConfig.layout; canvas.width = layout.canvasW; canvas.height = layout.canvasH; 
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            rawImages.forEach((img, idx) => {
                const slot = layout.photos[idx]; if(!slot) return;
                const srcW = (img.width/img.height < slot.w/slot.h) ? img.width : img.height * (slot.w/slot.h);
                const srcH = (img.width/img.height < slot.w/slot.h) ? img.width / (slot.w/slot.h) : img.height;
                const srcX = (img.width - srcW)/2, srcY = (img.height - srcH)/2;
                ctx.save(); ctx.translate(slot.x + slot.w/2, slot.y + slot.h/2); if(slot.angle) ctx.rotate(slot.angle * Math.PI/180);
                ctx.drawImage(img, srcX, srcY, srcW, srcH, -slot.w/2, -slot.h/2, slot.w, slot.h); ctx.restore();
            });

            await new Promise(res => {
                const frameImg = new Image(); frameImg.onload = () => { ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height); res(); };
                frameImg.onerror = () => res(); frameImg.src = frameConfig.src;
            });

            if (frameConfig.overlaySrc && frameConfig.overlayPos) {
                await new Promise(res => {
                    const overlayImg = new Image();
                    overlayImg.onload = () => { ctx.drawImage(overlayImg, frameConfig.overlayPos.x, frameConfig.overlayPos.y, frameConfig.overlayPos.w, frameConfig.overlayPos.h); res(); };
                    overlayImg.onerror = () => res(); overlayImg.src = frameConfig.overlaySrc;
                });
            }
        }

        function downloadImage() { const link = document.createElement('a'); link.download = `HQ_Photo_${Date.now()}.png`; link.href = canvas.toDataURL('image/png', 1.0); link.click(); }
    </script>
