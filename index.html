<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ-Photo - Trạm Chụp Ảnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        .logo-font { font-family: 'Dancing Script', cursive; }
        ::-webkit-scrollbar { display: none; }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4 / 3; 
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            background: black;
            border: 4px solid white;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Định nghĩa CSS cho các bộ lọc màu (Đã tích hợp làm mịn/trắng da nhẹ) */
        .filter-normal { filter: brightness(1.05) blur(0.5px); }
        .filter-wedding { filter: brightness(1.15) contrast(0.95) saturate(1.1) sepia(0.1) hue-rotate(-10deg) blur(0.5px); }
        .filter-korean { filter: brightness(1.12) contrast(0.9) saturate(0.9) blur(1px); }
        .filter-hk { filter: brightness(0.95) contrast(1.2) saturate(1.3) sepia(0.25) blur(0.5px); }
        .filter-fuji { filter: brightness(1.05) contrast(1.05) saturate(0.8) sepia(0.15) hue-rotate(15deg) blur(0.5px); }
        .filter-classic { filter: brightness(1.0) contrast(1.1) saturate(0.6) sepia(0.6) blur(0.5px); }
        .filter-sky { filter: brightness(1.1) contrast(1.0) saturate(1.2) sepia(0.1) hue-rotate(190deg) blur(0.5px); }
    </style>
</head>
<body class="bg-pink-50 min-h-screen font-sans overflow-x-hidden relative flex flex-col">

    <!-- Top Header -->
    <div class="flex justify-end items-center p-4 pb-2">
        <div class="text-right">
            <h1 class="text-4xl text-pink-400 logo-font">HQ-Photo</h1>
            <p class="text-[10px] text-pink-400 font-bold uppercase tracking-wider">Capture Memories</p>
        </div>
    </div>

    <!-- Settings Row -->
    <div class="flex justify-start gap-6 px-4 mb-4 text-xs font-semibold text-pink-400">
        <div class="flex flex-col">
            <span class="mb-1">Đếm Ngược</span>
            <div class="relative bg-white border border-pink-200 rounded px-2 py-1 flex items-center">
                <select id="countdownSelect" class="bg-transparent outline-none appearance-none pr-4 text-gray-700 w-full">
                    <option value="3">3s</option>
                    <option value="5">5s</option>
                    <option value="8">8s</option>
                </select>
                <span class="absolute right-2 text-pink-300 pointer-events-none">v</span>
            </div>
        </div>
        <div class="flex flex-col">
            <span class="mb-1 text-blue-500">Hỗ Trợ Chụp</span>
            <button onclick="openFrameSelectionModal()" class="bg-pink-100 border border-pink-200 text-pink-500 px-4 py-1 rounded shadow-sm active:scale-95 transition">Chọn Khung</button>
        </div>
    </div>

    <!-- Vùng Camera & Các Nút Điều Khiển Chụp -->
    <div id="mainCameraArea" class="flex flex-col items-center w-full">
        <!-- Camera View -->
        <div class="px-4 flex justify-center w-full relative">
            <div class="camera-container transition-all duration-300">
                <video id="camera" class="filter-normal" autoplay playsinline></video>

                <!-- Nút Flash & Switch -->
                <button class="absolute top-3 left-3 w-8 h-8 bg-white/80 rounded-full flex items-center justify-center text-gray-700 shadow z-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" /></svg>
                </button>
                <button onclick="switchCamera()" class="absolute top-3 right-3 w-8 h-8 bg-white/80 rounded-full flex items-center justify-center text-pink-500 shadow active:scale-90 transition z-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                </button>

                <!-- Bộ đếm ảnh -->
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-pink-300 text-white text-xs px-4 py-1.5 rounded-full font-bold shadow z-20">
                    Đã Chụp <span id="shootCount">0</span>/4
                </div>

                <!-- Đếm ngược -->
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-[100px] text-white font-bold drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] hidden z-30">3</div>
            </div>
        </div>

        <!-- Capture Controls -->
        <div class="flex justify-center items-center gap-6 mt-6 w-full max-w-sm mx-auto">
            <!-- Chụp tay -->
            <button onclick="captureManual()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center shadow-inner text-pink-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
                </div>
                <span class="text-[10px] text-pink-400 font-medium mt-1">Chụp tay</span>
            </button>

            <!-- Chụp Tự Động -->
            <button id="captureBtn" onclick="startAutoCapture()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-20 h-20 bg-pink-400 rounded-full flex items-center justify-center shadow-[0_4px_15px_rgba(244,114,182,0.6)] text-white border-4 border-white relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
                    <span class="absolute bottom-2 text-[9px] font-bold tracking-wider">AUTO</span>
                </div>
            </button>

            <!-- Chụp lại (Reset) -->
            <button onclick="resetApp()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow text-green-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </div>
                <span class="text-[10px] text-green-500 font-medium mt-1">Làm mới</span>
            </button>
        </div>
    </div> <!-- End mainCameraArea -->

    <!-- BỘ LỌC MÀU (THAY THẾ BẢNG LÀM ĐẸP) -->
    <div class="mt-8 px-4 mb-6 w-full mx-auto" id="filterPanel">
        <h3 class="text-pink-500 font-bold mb-3 text-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>
            Bộ lọc & Làm đẹp (Mới)
        </h3>
        
        <!-- Nơi chứa các icon bộ lọc có cuộn ngang -->
        <div class="flex gap-4 overflow-x-auto pb-4 pt-1 snap-x scroll-smooth">
            <!-- 1. Mặc định -->
            <button onclick="applyColorFilter('filter-normal', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-md ring-4 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-normal" alt="Normal">
                </div>
                <span class="text-[10px] font-bold text-pink-500">Mặc định</span>
            </button>

            <!-- 2. Tone Trắng -->
            <button onclick="applyColorFilter('filter-wedding', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-wedding" alt="Wedding">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Tone trắng</span>
            </button>

            <!-- 3. Hàn Quốc -->
            <button onclick="applyColorFilter('filter-korean', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-korean" alt="Korean">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Hàn Quốc</span>
            </button>

            <!-- 4. Hồng Kông -->
            <button onclick="applyColorFilter('filter-hk', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-hk" alt="HK">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Hồng Kông</span>
            </button>

            <!-- 5. Fujifilm -->
            <button onclick="applyColorFilter('filter-fuji', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-fuji" alt="Fuji">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Fujifilm</span>
            </button>

            <!-- 6. Cổ điển -->
            <button onclick="applyColorFilter('filter-classic', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-classic" alt="Classic">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Cổ điển</span>
            </button>

            <!-- 7. Sky -->
            <button onclick="applyColorFilter('filter-sky', this)" class="filter-btn flex flex-col items-center gap-2 snap-start flex-shrink-0 group opacity-70">
                <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm ring-0 ring-pink-400 p-0 transition-all duration-200">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-full h-full object-cover filter-sky" alt="Sky">
                </div>
                <span class="text-[10px] font-medium text-gray-500">Màu Sky</span>
            </button>
        </div>
    </div>

    <!-- Vùng Kết quả & Download -->
    <div id="resultArea" class="px-4 flex-col items-center mb-10 hidden w-full">
        <canvas id="resultCanvas" class="w-full max-w-[360px] shadow-2xl rounded-md bg-white"></canvas>
        <button onclick="downloadImage()" class="mt-6 px-10 py-3 bg-pink-500 text-white rounded-full font-bold shadow-lg shadow-pink-300 active:scale-95 transition text-lg w-full max-w-[360px]">⬇ Tải Ảnh Về Máy</button>
        <button onclick="resetApp()" class="mt-4 text-gray-500 font-medium underline active:text-gray-700">Chụp lại ảnh khác</button>
    </div>

    <!-- Modal 1: Giao diện Chọn Khung (Lưới) -->
    <div id="frameSelectionModal" class="fixed inset-0 bg-white z-50 hidden flex-col transition-transform duration-300">
        <div class="p-4 border-b flex items-center gap-3">
            <button onclick="closeFrameSelectionModal()" class="text-gray-500 hover:text-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>
            <div class="flex-1 relative">
                <input type="text" id="searchInput" placeholder="Tìm tên khung..." class="w-full bg-gray-100 rounded-full py-2 px-4 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300" onkeyup="filterFrames()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-4 p-4 overflow-y-auto pb-10 flex-1" id="frameSelectionGrid"></div>
    </div>

    <!-- Modal 2: Giao diện Xem Trước & Áp Dụng Khung -->
    <div id="framePreviewModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl overflow-hidden shadow-2xl relative flex flex-col">
            <button onclick="closeFramePreviewModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 bg-white rounded-full p-1 shadow z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div class="w-full flex-1 bg-gray-100 flex items-center justify-center p-4 h-[65vh]">
                <img id="previewModalImg" src="" class="h-full object-contain drop-shadow-md" alt="Preview">
            </div>
            <div class="p-4 bg-white border-t">
                <button onclick="applySelectedFrame()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg shadow-md active:bg-blue-600 transition">Áp dụng khung</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const shootCountEl = document.getElementById('shootCount');
        const mainCameraArea = document.getElementById('mainCameraArea');
        const resultArea = document.getElementById('resultArea');
        const filterPanel = document.getElementById('filterPanel');
        
        let stream;
        let useFrontCamera = true;
        let rawImages = [];
        let isProcessing = false;
        
        // Mặc định CSS class của bộ lọc hiện tại
        let activeFilterClass = 'filter-normal';
        // Chuỗi CSS filter thô để vẽ lên canvas
        let activeFilterCSSString = 'brightness(1.05) blur(0.5px)';
        
        const developerFrames = [
            { id: 'f1', name: 'Thiên Nga Hồng', src: '1.png' },
            { id: 'f2', name: 'Tình Yêu', src: '2.png' }
        ];
        
        let selectedFrameSrc = developerFrames.length > 0 ? developerFrames[0].src : ''; 
        let currentViewingFrameSrc = ''; 

        // 1. Khởi tạo Camera
        async function initCamera() {
            if (stream) { stream.getTracks().forEach(track => track.stop()); }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', aspectRatio: 4/3 },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) { alert('Vui lòng cấp quyền camera trong cài đặt trình duyệt!'); }
        }

        function switchCamera() { 
            useFrontCamera = !useFrontCamera; 
            video.style.transform = useFrontCamera ? "scaleX(-1)" : "scaleX(1)";
            initCamera(); 
        }

        // 2. Logic Chọn Bộ Lọc Màu
        function applyColorFilter(filterClass, btnElement) {
            // Thay đổi class cho video
            video.className = filterClass;
            activeFilterClass = filterClass;
            
            // Lấy chuỗi filter thực tế từ CSS để áp dụng cho canvas khi chụp
            // Tạo thẻ div ẩn để lấy style chuẩn
            const tempDiv = document.createElement('div');
            tempDiv.className = filterClass;
            document.body.appendChild(tempDiv);
            activeFilterCSSString = getComputedStyle(tempDiv).filter;
            document.body.removeChild(tempDiv);

            // Cập nhật UI Nút bấm
            const allBtns = document.querySelectorAll('.filter-btn');
            allBtns.forEach(btn => {
                btn.classList.add('opacity-70');
                const imgContainer = btn.querySelector('div');
                imgContainer.classList.remove('ring-4', 'shadow-md');
                imgContainer.classList.add('ring-0', 'shadow-sm');
                btn.querySelector('span').classList.remove('text-pink-500', 'font-bold');
                btn.querySelector('span').classList.add('text-gray-500', 'font-medium');
            });

            btnElement.classList.remove('opacity-70');
            const targetImgContainer = btnElement.querySelector('div');
            targetImgContainer.classList.remove('ring-0', 'shadow-sm');
            targetImgContainer.classList.add('ring-4', 'shadow-md');
            btnElement.querySelector('span').classList.remove('text-gray-500', 'font-medium');
            btnElement.querySelector('span').classList.add('text-pink-500', 'font-bold');
            
            // Cuộn tự động để hiển thị rõ nút được chọn
            btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        // 3. Hệ Thống Khung Modal
        function openFrameSelectionModal() {
            renderFrameSelectionGrid();
            document.getElementById('frameSelectionModal').classList.remove('hidden');
            document.getElementById('frameSelectionModal').classList.add('flex');
            document.getElementById('searchInput').value = ''; 
        }

        function closeFrameSelectionModal() {
            document.getElementById('frameSelectionModal').classList.add('hidden');
            document.getElementById('frameSelectionModal').classList.remove('flex');
        }

        function renderFrameSelectionGrid(filterText = '') {
            const grid = document.getElementById('frameSelectionGrid');
            grid.innerHTML = '';
            
            const filteredFrames = developerFrames.filter(frame => 
                frame.name.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredFrames.forEach(frame => {
                const div = document.createElement('div');
                div.className = `flex flex-col items-center cursor-pointer group`;
                div.onclick = () => openFramePreviewModal(frame.src);
                
                div.innerHTML = `
                    <div class="w-full aspect-[1/3] bg-gray-100 rounded-xl overflow-hidden shadow-sm group-active:scale-95 transition mb-2 border border-gray-200">
                        <img src="${frame.src}" onerror="this.src=''" class="w-full h-full object-cover" alt="${frame.name}">
                    </div>
                    <span class="text-xs text-gray-700 font-medium text-center truncate w-full">${frame.name}</span>
                `;
                grid.appendChild(div);
            });
        }

        function filterFrames() {
            const searchText = document.getElementById('searchInput').value;
            renderFrameSelectionGrid(searchText);
        }

        function openFramePreviewModal(src) {
            currentViewingFrameSrc = src;
            document.getElementById('previewModalImg').src = src;
            document.getElementById('framePreviewModal').classList.remove('hidden');
            document.getElementById('framePreviewModal').classList.add('flex');
        }

        function closeFramePreviewModal() {
            document.getElementById('framePreviewModal').classList.add('hidden');
            document.getElementById('framePreviewModal').classList.remove('flex');
            currentViewingFrameSrc = '';
        }

        function applySelectedFrame() {
            selectedFrameSrc = currentViewingFrameSrc;
            closeFramePreviewModal();
            closeFrameSelectionModal();
        }

        // 4. Chụp Ảnh
        function takeSnapshot() {
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[60] opacity-100 transition-opacity duration-150';
            document.body.appendChild(flash);
            setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 150); }, 50);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tCtx = tempCanvas.getContext('2d');
            
            // Gắn bộ lọc màu và làm đẹp vào ảnh trước khi chụp
            tCtx.filter = activeFilterCSSString;
            
            if (useFrontCamera) {
                tCtx.translate(tempCanvas.width, 0);
                tCtx.scale(-1, 1);
            }
            
            tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            rawImages.push(tempCanvas);
            shootCountEl.innerText = rawImages.length.toString();
        }

        async function captureManual() {
            if (isProcessing || rawImages.length >= 4) return;
            await countdownTimer(1);
            takeSnapshot();

            if (rawImages.length === 4) {
                await processFinalImage();
            }
        }

        async function startAutoCapture() {
            if (isProcessing) return;
            isProcessing = true;
            rawImages = [];
            shootCountEl.innerText = '0';
            
            const btn = document.getElementById('captureBtn');
            const countdownVal = parseInt(document.getElementById('countdownSelect').value);
            btn.classList.add('opacity-50');

            for (let i = 0; i < 4; i++) {
                await countdownTimer(countdownVal);
                takeSnapshot();
            }
            
            await processFinalImage();
            btn.classList.remove('opacity-50');
            isProcessing = false;
        }

        function countdownTimer(seconds) {
            return new Promise(resolve => {
                const el = document.getElementById('countdown');
                el.classList.remove('hidden');
                let count = seconds;
                el.innerText = count;
                const intv = setInterval(() => {
                    count--;
                    if (count > 0) { el.innerText = count; } 
                    else { clearInterval(intv); el.classList.add('hidden'); resolve(); }
                }, 1000);
            });
        }

        // 5. Render Ảnh Kết Quả
        async function processFinalImage() {
            isProcessing = true;
            
            const CANVAS_WIDTH = 1200;
            const CANVAS_HEIGHT = 3600;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT; 

            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const holeW = 960;
            const holeH = 640;
            const marginX = 120;
            const marginTop = 120; 
            const gapY = 100; 

            rawImages.forEach((img, idx) => {
                const drawX = marginX;
                const drawY = marginTop + idx * (holeH + gapY); 

                const rawRatio = img.width / img.height;
                const holeRatio = holeW / holeH;
                
                let sourceX = 0, sourceY = 0, sourceW = img.width, sourceH = img.height;
                
                if (rawRatio < holeRatio) {
                    sourceH = img.width / holeRatio;
                    sourceY = (img.height - sourceH) / 2;
                } else {
                    sourceW = img.height * holeRatio;
                    sourceX = (img.width - sourceW) / 2;
                }

                ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, drawX, drawY, holeW, holeH);
            });

            if (selectedFrameSrc) {
                await new Promise(resolve => {
                    const frameImg = new Image();
                    frameImg.onload = () => {
                        ctx.drawImage(frameImg, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                        resolve();
                    };
                    frameImg.onerror = () => {
                        console.warn("Không tìm thấy ảnh khung:", selectedFrameSrc);
                        resolve(); 
                    };
                    frameImg.src = selectedFrameSrc;
                });
            }

            mainCameraArea.classList.add('hidden'); 
            filterPanel.classList.add('hidden');
            
            resultArea.classList.remove('hidden'); 
            resultArea.classList.add('flex');
            
            resultArea.scrollIntoView({ behavior: 'smooth' });
            isProcessing = false;
        }

        function resetApp() {
            rawImages = [];
            shootCountEl.innerText = '0';
            isProcessing = false;
            
            resultArea.classList.add('hidden');
            resultArea.classList.remove('flex');
            
            mainCameraArea.classList.remove('hidden');
            filterPanel.classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `HQ_Photo_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        initCamera();
    </script>
</body>
