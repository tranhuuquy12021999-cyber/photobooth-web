<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ-Photo - Trạm Chụp Ảnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pink-50 min-h-screen font-sans flex flex-col items-center px-4 pt-10 pb-10">
    <div class="w-20 h-20 bg-pink-200 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-pink-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
    </div>
    <h2 class="text-2xl font-bold text-pink-600 mb-4 text-center">Chào mừng đến <span class="logo-font text-3xl">HQ-Photo</span></h2>
    <p class="text-gray-600 text-sm leading-relaxed mb-8 max-w-sm text-center">Mỗi bức ảnh là một mảnh ghép của thanh xuân.<br> Hãy chọn loại khung để bắt đầu nhé! ✨</p>
    
    <div class="flex flex-col gap-4 w-full max-w-sm">
        <label class="flex items-center justify-between p-4 border-2 border-pink-100 bg-white rounded-2xl shadow-sm cursor-pointer has-[:checked]:border-pink-500 has-[:checked]:bg-pink-50">
            <span class="font-bold text-gray-700">Khung 3 Ảnh</span>
            <input type="radio" name="photoType" value="3" class="w-5 h-5 accent-pink-500" checked>
        </label>
        <label class="flex items-center justify-between p-4 border-2 border-pink-100 bg-white rounded-2xl shadow-sm cursor-pointer has-[:checked]:border-pink-500 has-[:checked]:bg-pink-50">
            <span class="font-bold text-gray-700">Khung 4 Ảnh</span>
            <input type="radio" name="photoType" value="4" class="w-5 h-5 accent-pink-500">
        </label>
    </div>
    <button onclick="goToCamera()" class="w-full max-w-sm mt-8 bg-pink-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-pink-300 active:scale-95 transition">Tiếp tục</button>

    <script>
        function goToCamera() {
            const selectedType = document.querySelector('input[name="photoType"]:checked').value;
            window.location.href = selectedType + 'khung.html';
        }
    </script>
</body>
</html>
