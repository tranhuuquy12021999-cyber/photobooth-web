<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AR Mũ - HQ Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TẢI CÁC THƯ VIỆN AI NHẬN DIỆN KHUÔN MẶT CỦA GOOGLE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        .mirror { transform: scaleX(-1); }
        #loader {
            position: absolute; inset: 0; background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        .spinner {
            border: 4px solid #f3f4f6; border-top: 4px solid #ec4899;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-pink-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white p-4 rounded-2xl shadow-xl relative overflow-hidden">
        <h2 class="text-center text-pink-500 font-bold mb-4">Test Đội Mũ AI 🧢</h2>
        
        <video id="videoElement" class="hidden" autoplay playsinline muted></video>
        
        <div class="relative rounded-xl overflow-hidden bg-black aspect-[3/4] shadow-inner">
            <canvas id="outputCanvas" class="w-full h-full object-cover mirror"></canvas>
            
            <div id="loader">
                <div class="spinner mb-2"></div>
                <span class="text-pink-500 font-bold text-sm">AI đang khởi động...</span>
            </div>
        </div>
        
        <button onclick="location.href='index.html'" class="mt-6 w-full bg-gray-100 text-gray-600 font-bold py-3 rounded-xl active:scale-95 transition">
            Quay lại trang chủ
        </button>
    </div>

    <!-- Ảnh Mũ: Sẽ lấy file mu1.png trong thư mục Mu. Nếu chưa có file sẽ lấy link dự phòng -->
    <img id="stickerImg" src="Mu/mu1.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/9334/9334135.png'" class="hidden" crossorigin="anonymous">

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const stickerImg = document.getElementById('stickerImg');
        const loader = document.getElementById('loader');

        function onResults(results) {
            if(loader) loader.style.display = 'none';

            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // 1. Dùng 2 đuôi mắt để tính góc nghiêng đầu và tỷ lệ thu phóng
                const leftEye = landmarks[33]; 
                const rightEye = landmarks[263];
                // 2. Dùng đỉnh trán để làm điểm neo (chỗ đặt chiếc mũ)
                const forehead = landmarks[10];

                const x1 = leftEye.x * canvasElement.width;
                const y1 = leftEye.y * canvasElement.height;
                const x2 = rightEye.x * canvasElement.width;
                const y2 = rightEye.y * canvasElement.height;

                // Tọa độ đỉnh trán
                const hX = forehead.x * canvasElement.width;
                const hY = forehead.y * canvasElement.height;

                const eyeDistance = Math.hypot(x2 - x1, y2 - y1);
                const angle = Math.atan2(y2 - y1, x2 - x1);

                // Tính độ lớn của mũ (Khoảng 3.2 lần khoảng cách 2 mắt)
                const hatWidth = eyeDistance * 3.2; 
                const hatHeight = stickerImg.height * (hatWidth / stickerImg.width);

                // Dịch tâm vẽ đến đỉnh trán và xoay
                canvasCtx.translate(hX, hY);
                canvasCtx.rotate(angle);
                
                // Vẽ mũ: Lùi Y lên trên một đoạn bằng 90% chiều cao mũ (-hatHeight * 0.9) để mũ đội vừa đầu
                canvasCtx.drawImage(stickerImg, -hatWidth / 2, -hatHeight * 0.9, hatWidth, hatHeight);
            }
            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 480,
            height: 640,
            facingMode: "user"
        });
        
        camera.start();
    </script>
</body>
</html>
