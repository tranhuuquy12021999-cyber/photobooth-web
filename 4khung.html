<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chụp 4 Ảnh - HQ-Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css"> <!-- GỌI CSS CHUNG -->
</head>
<body class="bg-pink-50 min-h-screen font-sans flex flex-col pb-10">

    <!-- HEADER -->
    <div class="flex justify-between items-center p-4 mb-2">
        <a href="index.html" class="text-gray-500 hover:text-pink-500 font-bold text-sm bg-white px-3 py-1 rounded-full shadow-sm">← Quay lại</a>
        <div class="text-right">
            <h1 class="text-2xl text-pink-400 logo-font">HQ-Photo</h1>
            <p class="text-[8px] text-pink-400 font-bold uppercase tracking-wider">4 Photos</p>
        </div>
    </div>

    <!-- MÀN HÌNH 1: CAMERA -->
    <div id="mainCameraArea" class="flex flex-col items-center w-full">
        <div class="flex justify-between w-full max-w-sm px-4 mb-4">
            <span class="text-sm font-bold text-pink-500">Chế độ 4 Ảnh</span>
            <div class="flex items-center gap-2 text-xs font-bold text-pink-400">
                <select id="countdownSelect" class="bg-white border border-pink-200 rounded px-2 py-1 outline-none text-gray-700">
                    <option value="3">3s</option>
                    <option value="5">5s</option>
                </select>
            </div>
        </div>

        <div class="px-4 flex justify-center w-full relative">
            <div class="camera-container">
                <video id="camera" class="filter-normal" autoplay playsinline muted></video>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-pink-300 text-white text-xs px-4 py-1.5 rounded-full font-bold shadow z-20">
                    Đã Chụp <span id="shootCount">0</span>/4
                </div>
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-[100px] text-white font-bold drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] hidden z-30"></div>
            </div>
        </div>

        <div class="flex justify-center items-center gap-6 mt-6 w-full max-w-sm mx-auto">
            <button onclick="captureManual()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center shadow-inner text-pink-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
                </div>
                <span class="text-[10px] text-pink-400 font-medium mt-1">Chụp tay</span>
            </button>

            <button onclick="startAutoCapture()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-20 h-20 bg-pink-400 rounded-full flex items-center justify-center shadow-[0_4px_15px_rgba(244,114,182,0.6)] text-white border-4 border-white relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /></svg>
                    <span class="absolute bottom-2 text-[9px] font-bold tracking-wider">AUTO</span>
                </div>
            </button>
            
            <button onclick="resetApp()" class="flex flex-col items-center group active:scale-95 transition">
                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow text-green-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </div>
                <span class="text-[10px] text-green-500 font-medium mt-1">Làm mới</span>
            </button>
        </div>

        <div id="filterPanelContainer"></div> <!-- NƠI CHỨA BỘ LỌC -->
    </div>

    <!-- MÀN HÌNH 2: CHỌN KHUNG SAU KHI CHỤP -->
    <div id="frameSelectionArea" class="hidden flex-col items-center w-full mt-4 px-4">
        <h2 class="text-xl font-bold text-pink-500 mb-2">Chọn khung áp dụng</h2>
        <p class="text-xs text-gray-500 mb-4 text-center">Các khung dưới đây được thiết kế dành cho 4 ảnh bạn vừa chụp.</p>
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm" id="availableFramesGrid"></div>
    </div>

    <!-- MÀN HÌNH 3: KẾT QUẢ -->
    <div id="resultArea" class="hidden flex-col items-center w-full mt-6 px-4">
        <h2 class="text-xl font-bold text-pink-500 mb-6">Thành quả của bạn! 🎉</h2>
        <canvas id="resultCanvas" class="w-full max-w-[360px] shadow-2xl rounded-md bg-white"></canvas>
        <button onclick="downloadImage()" class="mt-6 w-full max-w-[360px] py-4 bg-pink-500 text-white rounded-xl font-bold shadow-lg active:scale-95 text-lg">⬇ Lưu Ảnh Về Máy</button>
        <button onclick="location.reload()" class="mt-4 text-gray-500 font-medium underline">Chụp bộ ảnh mới</button>
    </div>

    <!-- ==============================================
         NHÚNG CÁC SCRIPT
         ============================================== -->
    <script src="filters.js"></script> <!-- Nhúng Bộ lọc màu -->
    
    <script>var ALL_FRAMES = [];</script>
    
    <!-- NHÚNG CÁC KHUNG 4 ẢNH VÀO ĐÂY -->
    <script src="khung_kythuat.js"></script> 
    <!-- <script src="khung_4anh_khac.js"></script> -->

    <!-- LOGIC CHỤP & GHÉP -->
    <script>
        // Gọi hàm in Bộ lọc màu từ filters.js
        renderFilterPanel('filterPanelContainer');

        const video = document.getElementById('camera'), canvas = document.getElementById('resultCanvas'), ctx = canvas.getContext('2d');
        let stream, rawImages = [], isProcessing = false;

        async function initCamera() {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', aspectRatio: 4/3 }, audio: false }); video.srcObject = stream; video.onloadedmetadata = () => video.play(); } 
            catch (err) { alert('Vui lòng cấp quyền camera!'); }
        }
        initCamera();

        function takeSnapshot() {
            const tempCanvas = document.createElement('canvas'); tempCanvas.width = video.videoWidth; tempCanvas.height = video.videoHeight;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.filter = activeFilterCSSString; tCtx.translate(tempCanvas.width, 0); tCtx.scale(-1, 1);
            tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            rawImages.push(tempCanvas); document.getElementById('shootCount').innerText = rawImages.length;
        }

        async function captureManual() {
            if(rawImages.length >= 4 || isProcessing) return; // CHÚ Ý: Đã đổi thành 4
            await countdownTimer(1); takeSnapshot();
            if(rawImages.length === 4) showFrameSelection();
        }

        async function startAutoCapture() {
            if(isProcessing) return; isProcessing = true; rawImages = []; document.getElementById('shootCount').innerText = '0';
            const val = parseInt(document.getElementById('countdownSelect').value);
            for(let i=0; i<4; i++) { // CHÚ Ý: Vòng lặp 4 lần
                await countdownTimer(val); takeSnapshot(); 
            }
            isProcessing = false; showFrameSelection();
        }

        function countdownTimer(sec) {
            return new Promise(res => {
                const el = document.getElementById('countdown'); el.classList.remove('hidden'); let count = sec; el.innerText = count;
                const intv = setInterval(() => { count--; if(count>0) el.innerText = count; else { clearInterval(intv); el.classList.add('hidden'); res(); } }, 1000);
            });
        }

        // Hiện lưới chọn khung TỪ BIẾN ALL_FRAMES
        function showFrameSelection() {
            document.getElementById('mainCameraArea').classList.add('hidden');
            const grid = document.getElementById('availableFramesGrid'); grid.innerHTML = '';
            
            // CHÚ Ý: Lọc ra các khung có type = 4
            const frames4 = ALL_FRAMES.filter(f => f.type === 4);
            
            if(frames4.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-4">Chưa có dữ liệu khung 4 ảnh!</p>';
            }

            frames4.forEach(frame => {
                const div = document.createElement('div');
                div.className = `flex flex-col bg-white p-2 rounded-xl shadow-sm border border-pink-100 cursor-pointer active:scale-95`;
                div.onclick = () => processFinalImage(frame);
                div.innerHTML = `<img src="${frame.src}" class="w-full aspect-[1/3] object-cover rounded-lg mb-2 bg-gray-100"><span class="text-xs font-bold text-center w-full truncate">${frame.name}</span>`;
                grid.appendChild(div);
            });
            document.getElementById('frameSelectionArea').classList.remove('hidden');
            document.getElementById('frameSelectionArea').classList.add('flex');
        }

        async function processFinalImage(frameConfig) {
            document.getElementById('frameSelectionArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden'); document.getElementById('resultArea').classList.add('flex');
            
            const layout = frameConfig.layout; canvas.width = layout.canvasW; canvas.height = layout.canvasH; 
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            rawImages.forEach((img, idx) => {
                const slot = layout.photos[idx]; if(!slot) return;
                const srcW = (img.width/img.height < slot.w/slot.h) ? img.width : img.height * (slot.w/slot.h);
                const srcH = (img.width/img.height < slot.w/slot.h) ? img.width / (slot.w/slot.h) : img.height;
                const srcX = (img.width - srcW)/2, srcY = (img.height - srcH)/2;
                
                ctx.save(); ctx.translate(slot.x + slot.w/2, slot.y + slot.h/2); if(slot.angle) ctx.rotate(slot.angle * Math.PI/180);
                ctx.drawImage(img, srcX, srcY, srcW, srcH, -slot.w/2, -slot.h/2, slot.w, slot.h); ctx.restore();
            });

            await new Promise(res => {
                const frameImg = new Image(); frameImg.onload = () => { ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height); res(); };
                frameImg.onerror = () => res(); frameImg.src = frameConfig.src;
            });
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadImage() { const link = document.createElement('a'); link.download = `HQ_Photo_${Date.now()}.png`; link.href = canvas.toDataURL('image/png', 1.0); link.click(); }
    </script>
</body>
</html>
